[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prefcent"
version = "0.1.0"
description = "Preferential Centrality Solver (canonical reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Hellervik" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/prefcent/prefcent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prefcent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: stored-trajectory and fixed-point comparisons",
    "property: conservation, continuation, fail-stop, and contract properties",
    "slow: long-running cases",
    "benchmark: performance measurements",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# numpy 2.5 stubs use 3.12 type statements. Package syntax stays 3.11
# (ruff target-version py311).
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
